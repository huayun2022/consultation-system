<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心理咨询预约系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#f5f7fa;color:#333;min-height:100vh;line-height:1.6}
.container{max-width:680px;margin:0 auto;padding:20px}
.header{background:#fff;border-radius:10px;padding:32px 22px;text-align:center;margin-bottom:18px}
.header h1{font-size:23px;font-weight:500;margin-bottom:16px}
.notice{background:#f0f7ff;border-radius:6px;padding:14px;text-align:left;font-size:14px;color:#555}
.notice strong{color:#333}
.btn-group{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.btn{padding:12px 26px;border:none;border-radius:6px;font-size:15px;cursor:pointer;transition:background .2s;font-family:inherit}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-primary{background:#4a90d9;color:#fff}
.btn-primary:hover:not(:disabled){background:#357abd}
.btn-secondary{background:#fff;color:#4a90d9;border:1px solid #4a90d9}
.btn-secondary:hover:not(:disabled){background:#f0f7ff}
.btn-success{background:#52c41a;color:#fff}
.btn-success:hover:not(:disabled){background:#389e0d}
.btn-danger{background:#ff4d4f;color:#fff}
.btn-danger:hover:not(:disabled){background:#d9363e}
.btn-plain{background:#f0f2f5;color:#555}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:5px}
.tech{text-align:center;padding-top:16px;color:#999;font-size:13px}
.card{background:#fff;border-radius:10px;padding:22px;margin-bottom:16px}
.card h2{font-size:17px;font-weight:500;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid #eee}
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:6px;font-size:14px;color:#666}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:6px;font-size:15px;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#4a90d9}
.form-group textarea{resize:vertical;min-height:80px}
.form-row{display:flex;gap:14px;flex-wrap:wrap}
.form-row .form-group{flex:1;min-width:130px}
.back-link{display:inline-block;margin-bottom:14px;color:#4a90d9;font-size:14px;cursor:pointer}
.alert{padding:11px 14px;border-radius:6px;margin:12px 0;font-size:14px}
.alert-success{background:#f6ffed;border:1px solid #b7eb8f;color:#3f6600}
.alert-error{background:#fff2f0;border:1px solid #ffccc7;color:#c53030}
.alert-info{background:#f0f7ff;border:1px solid #b5d4f4;color:#185fa5}
.tabs{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:9px 18px;border:none;background:#eef1f5;border-radius:6px;cursor:pointer;font-size:14px;font-family:inherit}
.tab.active{background:#4a90d9;color:#fff}
.item{border:1px solid #e8e8e8;border-radius:8px;padding:15px;margin-bottom:14px}
.item.pending{border-left:3px solid #faad14}
.item.replied{border-left:3px solid #52c41a}
.item .line{font-size:14px;color:#555;margin-bottom:4px}
.item .line strong{color:#333}
.item .reply-box{margin-top:12px;padding-top:12px;border-top:1px solid #eee}
.item .reply-done{margin-top:12px;padding-top:12px;border-top:1px solid #eee;color:#3f6600;font-size:14px}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;margin-left:6px}
.badge-pending{background:#fff7e6;color:#ad6800}
.badge-replied{background:#f6ffed;color:#3f6600}
.empty{text-align:center;padding:32px;color:#999;font-size:14px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.stat{flex:1;min-width:100px;background:#f7f9fc;border-radius:8px;padding:14px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:500;color:#185fa5}
.stat span{font-size:13px;color:#777}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 6px;border-bottom:1px solid #eee;text-align:left;vertical-align:middle}
th{color:#777;font-weight:500}
.ops{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ops input{width:120px;padding:6px 8px;border:1px solid #ddd;border-radius:5px;font-size:13px}
.muted{color:#999;font-size:13px}
.hint{font-size:13px;color:#888;margin-top:8px}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">

  <div id="mainPage" class="header">
    <h1>心理咨询预约系统</h1>
    <div class="notice">
      <strong>来访者请注意：</strong><br>
      1. 请如实填写预约信息，咨询师会通过预留手机号与您联系<br>
      2. 提交后请留意手机来电<br>
      3. 再次进入本系统，用「手机号 + 姓名」查询咨询师回复
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="showPage('clientPage')">来访者入口</button>
      <button class="btn btn-secondary" onclick="openLogin()">咨询师入口</button>
      <button class="btn btn-secondary" onclick="openLogin()">系统管理</button>
    </div>
    <div class="tech">技术支持电话：15684510919</div>
  </div>

  <div id="clientPage" class="hidden">
    <a class="back-link" onclick="showPage('mainPage')">← 返回首页</a>
    <div class="card">
      <h2>预约咨询</h2>
      <div class="form-group"><label>姓名 *</label><input type="text" id="cName" maxlength="30" placeholder="请输入您的姓名"></div>
      <div class="form-row">
        <div class="form-group"><label>性别</label><select id="cGender"><option value="">请选择</option><option value="男">男</option><option value="女">女</option></select></div>
        <div class="form-group"><label>年龄</label><input type="number" id="cAge" min="1" max="120" placeholder="选填"></div>
      </div>
      <div class="form-group"><label>手机号码 *</label><input type="tel" id="cPhone" maxlength="11" placeholder="11 位手机号"></div>
      <div class="form-group"><label>预约日期 *</label><input type="date" id="cDate"></div>
      <div class="form-group"><label>咨询原因</label><textarea id="cReason" rows="3" maxlength="2000" placeholder="请简要描述您想咨询的事情"></textarea></div>
      <button class="btn btn-success" style="width:100%" onclick="submitAppointment(this)">提交预约</button>
      <div id="submitMsg"></div>
    </div>
    <div class="card">
      <h2>查询回复</h2>
      <div class="form-group"><label>手机号码 *</label><input type="tel" id="qPhone" maxlength="11" placeholder="预约时填写的手机号"></div>
      <div class="form-group"><label>姓名 *</label><input type="text" id="qName" maxlength="30" placeholder="预约时填写的姓名"></div>
      <button class="btn btn-primary" style="width:100%" onclick="queryAppointment(this)">查询</button>
      <div id="queryResult"></div>
    </div>
  </div>

  <div id="loginPage" class="hidden">
    <a class="back-link" onclick="showPage('mainPage')">← 返回首页</a>
    <div class="card">
      <h2>工作人员登录</h2>
      <div class="form-group"><label>账号</label><input type="text" id="lUser" autocomplete="username" placeholder="请输入账号"></div>
      <div class="form-group"><label>密码</label><input type="password" id="lPass" autocomplete="current-password" placeholder="请输入密码"></div>
      <button class="btn btn-primary" style="width:100%" onclick="doLogin(this)">登录</button>
      <div id="loginMsg"></div>
      <div class="hint">连续输错 5 次会锁定 15 分钟。登录后请及时修改初始密码。</div>
    </div>
  </div>

  <div id="counselorPage" class="hidden">
    <a class="back-link" onclick="doLogout(this)">← 安全退出</a>
    <div class="card">
      <h2>咨询师工作台 · <span id="cWelcome"></span></h2>
      <div class="tabs">
        <button class="tab active" id="tabPending" onclick="switchTab('pending',this)">待回复 (<span id="pendingCount">0</span>)</button>
        <button class="tab" id="tabReplied" onclick="switchTab('replied',this)">已回复 (<span id="repliedCount">0</span>)</button>
        <button class="btn btn-plain btn-sm" onclick="refreshCounselor()">刷新</button>
      </div>
      <div id="counselorList"></div>
      <div id="counselorMsg"></div>
    </div>
    <div class="card">
      <h2>修改密码</h2>
      <div class="form-group"><label>原密码</label><input type="password" id="cpOld"></div>
      <div class="form-group"><label>新密码（至少 8 位）</label><input type="password" id="cpNew"></div>
      <button class="btn btn-secondary" onclick="changePassword(this,'counselorMsg')">修改密码</button>
    </div>
  </div>

  <div id="adminPage" class="hidden">
    <a class="back-link" onclick="doLogout(this)">← 安全退出</a>
    <div class="card">
      <h2>系统管理 · <span id="aWelcome"></span></h2>
      <div class="stats">
        <div class="stat"><b id="statTotal">0</b><span>全部预约</span></div>
        <div class="stat"><b id="statPending">0</b><span>待回复</span></div>
        <div class="stat"><b id="statReplied">0</b><span>已回复</span></div>
      </div>
      <button class="btn btn-secondary btn-sm" onclick="exportData(this)">导出数据</button>
      <button class="btn btn-danger btn-sm" onclick="clearData(this)">清空所有预约</button>
      <div id="adminMsg"></div>
    </div>
    <div class="card">
      <h2>工作人员账号</h2>
      <div id="staffTable"></div>
      <h2 style="margin-top:24px">新增账号</h2>
      <div class="form-row">
        <div class="form-group"><label>账号</label><input type="text" id="sUser" placeholder="小写字母/数字"></div>
        <div class="form-group"><label>显示姓名</label><input type="text" id="sName" maxlength="30"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>角色</label><select id="sRole"><option value="counselor">咨询师</option><option value="admin">管理员</option></select></div>
        <div class="form-group"><label>初始密码（至少 8 位）</label><input type="text" id="sPass"></div>
      </div>
      <button class="btn btn-success" onclick="addStaff(this)">新增账号</button>
    </div>
    <div class="card">
      <h2>修改我的密码</h2>
      <div class="form-group"><label>原密码</label><input type="password" id="apOld"></div>
      <div class="form-group"><label>新密码（至少 8 位）</label><input type="password" id="apNew"></div>
      <button class="btn btn-secondary" onclick="changePassword(this,'adminMsg')">修改密码</button>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<script>
  if (!window.WorkBuddyCloud) {
    var sc = new URLSearchParams(location.search).get('sharecode');
    document.write('<script src="vendor/index.global.js' + (sc ? '?sharecode=' + encodeURIComponent(sc) : '') + '"><\/script>');
  }
</script>
<script>
const publicConfig = {
  endpoint: 'https://wbapp-gbhqqpulhedjeivo6lbd4j.app.workbuddy.host',
  oauthRelayBaseUrl: 'https://www.workbuddy.cn/v2/as/genie-baas/oauth',
  publishableKey: 'wbpk_GbHQQpuLheDjEIvo6lBD4J_1XMZc9Ov8bpPL5vtKEfzSB4fk7wj53AG'
};

const cloud = window.WorkBuddyCloud ? WorkBuddyCloud.createWorkBuddyCloud({
  endpoint: publicConfig.endpoint,
  oauthRelayBaseUrl: publicConfig.oauthRelayBaseUrl,
  publishableKey: publicConfig.publishableKey
}) : null;

const RPC_OF = {
  submit: 'guest_api', lookup: 'guest_api',
  login: 'auth_api', logout: 'auth_api', change_password: 'auth_api',
  list: 'staff_api', reply: 'staff_api', overview: 'staff_api',
  export: 'admin_data_api', clear: 'admin_data_api',
  staff_list: 'admin_staff_api', staff_add: 'admin_staff_api',
  staff_toggle: 'admin_staff_api', staff_reset_password: 'admin_staff_api'
};

const VIEWS = ['mainPage', 'clientPage', 'loginPage', 'counselorPage', 'adminPage'];
const SESSION_KEY = 'consultation_staff_session';
let state = { token: '', role: '', name: '' };
let currentTab = 'pending';

try {
  const saved = JSON.parse(localStorage.getItem(SESSION_KEY) || '{}');
  state = { token: saved.token || '', role: saved.role || '', name: saved.name || '' };
} catch (e) { state = { token: '', role: '', name: '' }; }

function saveSession(r) {
  state = { token: r.token, role: r.role, name: r.name };
  localStorage.setItem(SESSION_KEY, JSON.stringify(state));
}
function clearSession() {
  state = { token: '', role: '', name: '' };
  localStorage.removeItem(SESSION_KEY);
}
function showPage(id) {
  VIEWS.forEach(v => document.getElementById(v).classList.toggle('hidden', v !== id));
  window.scrollTo(0, 0);
}
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function setMsg(id, text, kind) {
  document.getElementById(id).innerHTML = text
    ? '<div class="alert alert-' + (kind || 'info') + '">' + esc(text) + '</div>' : '';
}
function errText(e) {
  return (e && e.message) ? e.message : '网络或服务暂时不可用，请稍后重试';
}
async function busy(btn, fn) {
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = '处理中…';
  try { return await fn(); } finally { btn.disabled = false; btn.textContent = old; }
}
function val(id) { return document.getElementById(id).value.trim(); }

async function api(action, payload) {
  if (!cloud) throw new Error('云端服务未加载，请刷新页面重试');
  const body = Object.assign({}, payload || {});
  if (state.token && action !== 'login') body.token = state.token;
  const rpc = RPC_OF[action];
  if (!rpc) throw new Error('未知操作');
  const { data, error } = await cloud.database.rpc(rpc, { p_action: action, p_payload: body });
  if (error) throw new Error(error.message || '服务暂时不可用，请稍后重试');
  let r = data;
  if (Array.isArray(r)) r = r[0];
  if (typeof r === 'string') { try { r = JSON.parse(r); } catch (e) {} }
  if (!r || typeof r !== 'object') throw new Error('服务返回异常');
  if (r.ok === false && r.code === 'UNAUTHENTICATED') {
    clearSession(); showPage('loginPage');
  }
  return r;
}

function openLogin() {
  if (state.token) {
    showPage(state.role === 'admin' ? 'adminPage' : 'counselorPage');
    state.role === 'admin' ? loadAdmin() : refreshCounselor();
    return;
  }
  setMsg('loginMsg', '');
  showPage('loginPage');
}

async function doLogin(btn) {
  setMsg('loginMsg', '');
  await busy(btn, async () => {
    try {
      const r = await api('login', { username: val('lUser'), password: val('lPass') });
      if (!r.ok) { setMsg('loginMsg', r.message || '登录失败', 'error'); return; }
      saveSession(r);
      document.getElementById('lPass').value = '';
      if (r.role === 'admin') { showPage('adminPage'); await loadAdmin(); }
      else { showPage('counselorPage'); await refreshCounselor(); }
      if (r.must_change) {
        setMsg(r.role === 'admin' ? 'adminMsg' : 'counselorMsg', '当前使用的是临时密码，请尽快在下方修改。', 'info');
      }
    } catch (e) { setMsg('loginMsg', errText(e), 'error'); }
  });
}

async function doLogout(btn) {
  await busy(btn, async () => {
    try { await api('logout', {}); } catch (e) {}
    clearSession(); showPage('mainPage');
  });
}

function setTomorrowMin() {
  const d = new Date(); d.setDate(d.getDate() + 1);
  const s = [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-');
  document.getElementById('cDate').min = s;
}
setTomorrowMin();

async function submitAppointment(btn) {
  setMsg('submitMsg', '');
  await busy(btn, async () => {
    try {
      const r = await api('submit', {
        name: val('cName'), gender: val('cGender'), age: val('cAge'),
        phone: val('cPhone'), visit_date: val('cDate'), reason: val('cReason')
      });
      if (!r.ok) { setMsg('submitMsg', r.message, 'error'); return; }
      ['cName', 'cGender', 'cAge', 'cPhone', 'cDate', 'cReason'].forEach(id => document.getElementById(id).value = '');
      setTomorrowMin();
      setMsg('submitMsg', '预约成功！请留意手机来电，稍后可用手机号和姓名查询回复。', 'success');
    } catch (e) { setMsg('submitMsg', errText(e), 'error'); }
  });
}

async function queryAppointment(btn) {
  const box = document.getElementById('queryResult');
  box.innerHTML = '';
  await busy(btn, async () => {
    try {
      const r = await api('lookup', { phone: val('qPhone'), name: val('qName') });
      if (!r.ok) { box.innerHTML = '<div class="alert alert-error">' + esc(r.message) + '</div>'; return; }
      const items = Array.isArray(r.items) ? r.items : [];
      if (!items.length) {
        box.innerHTML = '<div class="alert alert-info">没有找到匹配的预约，请核对手机号和姓名。</div>';
        return;
      }
      box.innerHTML = items.map(a =>
        '<div class="item ' + (a.status === 'pending' ? 'pending' : 'replied') + '">' +
        '<div class="line"><strong>预约日期：</strong>' + esc(a.visit_date) +
        '<span class="badge ' + (a.status === 'pending' ? 'badge-pending">待回复' : 'badge-replied">已回复') + '</span></div>' +
        '<div class="line"><strong>咨询原因：</strong>' + esc(a.reason) + '</div>' +
        '<div class="reply-done"><strong>咨询师回复：</strong><br>' +
        (a.reply ? esc(a.reply) : '咨询师尚未回复，请耐心等待') + '</div>' +
        '<div class="hint">提交时间：' + esc(a.created_at) + '</div></div>'
      ).join('');
    } catch (e) { box.innerHTML = '<div class="alert alert-error">' + esc(errText(e)) + '</div>'; }
  });
}

function renderBadge(status) {
  return status === 'pending'
    ? '<span class="badge badge-pending">待回复</span>'
    : '<span class="badge badge-replied">已回复</span>';
}

function switchTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  refreshCounselor();
}

async function refreshCounselor() {
  const box = document.getElementById('counselorList');
  setMsg('counselorMsg', '');
  document.getElementById('cWelcome').textContent = state.name || '';
  try {
    const [ov, list] = await Promise.all([
      api('overview', {}), api('list', { filter: currentTab })
    ]);
    if (!ov.ok || !list.ok) {
      setMsg('counselorMsg', ov.message || list.message || '加载失败', 'error'); return;
    }
    document.getElementById('pendingCount').textContent = ov.pending;
    document.getElementById('repliedCount').textContent = ov.replied;
    const items = Array.isArray(list.items) ? list.items : [];
    if (!items.length) {
      box.innerHTML = '<div class="empty">' + (currentTab === 'pending' ? '暂无待回复的预约' : '暂无已回复的记录') + '</div>';
      return;
    }
    box.innerHTML = items.map(a =>
      '<div class="item ' + (a.status === 'pending' ? 'pending' : 'replied') + '">' +
      '<div class="line"><strong>' + esc(a.name) + '</strong> | ' + esc(a.gender) + ' | ' + esc(a.age) + '岁 | 手机：' + esc(a.phone) + renderBadge(a.status) + '</div>' +
      '<div class="line"><strong>预约日期：</strong>' + esc(a.visit_date) + '</div>' +
      '<div class="line"><strong>咨询原因：</strong>' + esc(a.reason) + '</div>' +
      '<div class="hint">提交时间：' + esc(a.created_at) + '</div>' +
      (a.status === 'pending'
        ? '<div class="reply-box"><div class="form-group"><textarea id="reply-' + esc(a.id) + '" rows="2" maxlength="4000" placeholder="请输入回复内容"></textarea></div>' +
          '<button class="btn btn-success btn-sm" onclick="submitReply(this,' + esc(a.id) + ')">提交回复</button></div>'
        : '<div class="reply-done"><strong>已回复：</strong>' + esc(a.reply) + '</div>') +
      '</div>'
    ).join('');
  } catch (e) { setMsg('counselorMsg', errText(e), 'error'); }
}

async function submitReply(btn, id) {
  const text = document.getElementById('reply-' + id).value.trim();
  if (!text) { alert('请输入回复内容'); return; }
  await busy(btn, async () => {
    try {
      const r = await api('reply', { id: String(id), reply: text });
      if (!r.ok) { setMsg('counselorMsg', r.message, 'error'); return; }
      await refreshCounselor();
      setMsg('counselorMsg', '回复成功', 'success');
    } catch (e) { setMsg('counselorMsg', errText(e), 'error'); }
  });
}

async function loadAdmin() {
  setMsg('adminMsg', '');
  document.getElementById('aWelcome').textContent = state.name || '';
  try {
    const [ov, staff] = await Promise.all([api('overview', {}), api('staff_list', {})]);
    if (!ov.ok || !staff.ok) {
      setMsg('adminMsg', ov.message || staff.message || '加载失败', 'error'); return;
    }
    document.getElementById('statTotal').textContent = ov.total;
    document.getElementById('statPending').textContent = ov.pending;
    document.getElementById('statReplied').textContent = ov.replied;
    const rows = Array.isArray(staff.items) ? staff.items : [];
    document.getElementById('staffTable').innerHTML =
      '<table><tr><th>账号</th><th>姓名</th><th>角色</th><th>状态</th><th>操作 / 重置密码</th></tr>' +
      rows.map(s =>
        '<tr><td>' + esc(s.username) + '</td><td>' + esc(s.name) + '</td>' +
        '<td>' + (s.role === 'admin' ? '管理员' : '咨询师') + '</td>' +
        '<td>' + (s.active ? '在用' : '已停用') + '</td>' +
        '<td><div class="ops">' +
        '<button class="btn btn-plain btn-sm" onclick="toggleStaff(this,' + esc(s.id) + ')">' + (s.active ? '停用' : '启用') + '</button>' +
        '<input type="password" id="np-' + esc(s.id) + '" placeholder="新密码">' +
        '<button class="btn btn-secondary btn-sm" onclick="resetPassword(this,' + esc(s.id) + ')">重置</button>' +
        '</div></td></tr>'
      ).join('') + '</table>';
  } catch (e) { setMsg('adminMsg', errText(e), 'error'); }
}

async function exportData(btn) {
  await busy(btn, async () => {
    try {
      const r = await api('export', {});
      if (!r.ok) { setMsg('adminMsg', r.message, 'error'); return; }
      const blob = new Blob([JSON.stringify(r.items || [], null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'consultation_data_' + new Date().toISOString().slice(0, 10) + '.json';
      a.click();
      URL.revokeObjectURL(a.href);
      setMsg('adminMsg', '数据已导出', 'success');
    } catch (e) { setMsg('adminMsg', errText(e), 'error'); }
  });
}

async function clearData(btn) {
  if (!confirm('确定要清空所有预约数据吗？此操作不可恢复！')) return;
  if (prompt('请输入「清空」两个字确认') !== '清空') { setMsg('adminMsg', '已取消清空', 'info'); return; }
  await busy(btn, async () => {
    try {
      const r = await api('clear', { confirm: 'CLEAR_ALL' });
      if (!r.ok) { setMsg('adminMsg', r.message, 'error'); return; }
      await loadAdmin();
      setMsg('adminMsg', '所有预约数据已清空', 'success');
    } catch (e) { setMsg('adminMsg', errText(e), 'error'); }
  });
}

async function addStaff(btn) {
  await busy(btn, async () => {
    try {
      const r = await api('staff_add', {
        username: val('sUser'), name: val('sName'), role: val('sRole'), password: val('sPass')
      });
      if (!r.ok) { setMsg('adminMsg', r.message, 'error'); return; }
      ['sUser', 'sName', 'sPass'].forEach(id => document.getElementById(id).value = '');
      await loadAdmin();
      setMsg('adminMsg', '账号已创建', 'success');
    } catch (e) { setMsg('adminMsg', errText(e), 'error'); }
  });
}

async function toggleStaff(btn, id) {
  if (!confirm('确定要切换该账号的启用状态吗？')) return;
  await busy(btn, async () => {
    try {
      const r = await api('staff_toggle', { id: String(id) });
      if (!r.ok) { setMsg('adminMsg', r.message, 'error'); return; }
      await loadAdmin();
      setMsg('adminMsg', '账号状态已更新', 'success');
    } catch (e) { setMsg('adminMsg', errText(e), 'error'); }
  });
}

async function resetPassword(btn, id) {
  const pwd = document.getElementById('np-' + id).value;
  if (!pwd) { setMsg('adminMsg', '请先填写新密码', 'error'); return; }
  if (!confirm('重置后该账号需重新登录，确定继续吗？')) return;
  await busy(btn, async () => {
    try {
      const r = await api('staff_reset_password', { id: String(id), password: pwd });
      if (!r.ok) { setMsg('adminMsg', r.message, 'error'); return; }
      document.getElementById('np-' + id).value = '';
      setMsg('adminMsg', '密码已重置', 'success');
    } catch (e) { setMsg('adminMsg', errText(e), 'error'); }
  });
}

async function changePassword(btn, msgId) {
  const oldPwd = val(msgId === 'adminMsg' ? 'apOld' : 'cpOld');
  const newPwd = val(msgId === 'adminMsg' ? 'apNew' : 'cpNew');
  if (!oldPwd || !newPwd) { setMsg(msgId, '请填写原密码和新密码', 'error'); return; }
  await busy(btn, async () => {
    try {
      const r = await api('change_password', { old_password: oldPwd, new_password: newPwd });
      if (!r.ok) { setMsg(msgId, r.message, 'error'); return; }
      document.getElementById(msgId === 'adminMsg' ? 'apOld' : 'cpOld').value = '';
      document.getElementById(msgId === 'adminMsg' ? 'apNew' : 'cpNew').value = '';
      setMsg(msgId, '密码已修改，下次登录请使用新密码', 'success');
    } catch (e) { setMsg(msgId, errText(e), 'error'); }
  });
}

if (!cloud) {
  document.getElementById('mainPage').insertAdjacentHTML('beforeend',
    '<div class="alert alert-error">云端服务加载失败，请检查网络后刷新页面重试。</div>');
}
</script>
</body>
